name: Build Su-SAO package

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build package
        id: package
        shell: bash
        run: |
          npm run release
          version="$(node -p 'require("./komari-theme.json").version')"
          archive="Su-SAO-v${version}.zip"
          test -f "$archive"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package version $version"
            exit 1
          fi
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: Su-SAO-package
          path: |
            ${{ steps.package.outputs.archive }}
            preview.png

      - name: Resolve release notes
        if: startsWith(github.ref, 'refs/tags/')
        id: release-notes
        shell: bash
        run: |
          notes=".github/release-notes/${GITHUB_REF_NAME}.md"
          if [[ -f "$notes" ]]; then
            echo "path=$notes" >> "$GITHUB_OUTPUT"
          else
            echo "Release ${GITHUB_REF_NAME}" > default-notes.md
            echo "path=default-notes.md" >> "$GITHUB_OUTPUT"
          fi

      # Komari 安装主题时直接取第一个附件，因此 Release 只上传主题 ZIP。
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Su-SAO ${{ github.ref_name }}
          files: ${{ steps.package.outputs.archive }}
          fail_on_unmatched_files: true
          body_path: ${{ steps.release-notes.outputs.path }}
